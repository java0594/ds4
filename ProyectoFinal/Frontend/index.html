<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>MiniPetCare - Perfil Médico</title>

  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-light">
    
   <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">MiniPetCare</a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="index.html">Perfil Médico</a>
            <a class="nav-link" href="duenos.html">Dueños</a>
            <a class="nav-link" href="mascotas.html">Mascotas</a>
            <a class="nav-link" href="vacunas.html">Vacunas</a>
        </div>
    </div>
</nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">🐾 Perfil Médico de Mascota</h2>



       
        <div class="card mb-4">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-8">
                        <input type="number" id="mascotaId" class="form-control" placeholder="Ingrese ID de la mascota">
                    </div>
                    <div class="col-md-4 d-grid">
                        <button class="btn btn-primary" onclick="buscarPerfil()">Buscar</button>
                    </div>
                </div>
            </div>
        </div>

       
        <div id="perfil" style="display:none;">
            <div class="card mb-3">
                <div class="card-header bg-primary text-white">
                    Información de la Mascota
                </div>
                <div class="card-body" id="datosMascota"></div>
            </div>

           
            <div class="card">
                <div class="card-header bg-success text-white">
                    Historial de Vacunas
                </div>
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>Vacuna</th>
                                <th>Fecha Aplicada</th>
                                <th>Próxima Fecha</th>
                                <th>Observaciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaVacunas"></tbody>
                    </table>
                </div>
            </div>
        </div>

        
        <div id="mensaje" class="mt-3"></div>
    </div>

    <script src="perfilMedico.js"></script>
</body>

</html>
