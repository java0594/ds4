<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Dueños</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">MiniPetCare</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Perfil Médico</a>
                <a class="nav-link active" href="duenos.html">Dueños</a>
                <a class="nav-link" href="mascotas.html">Mascotas</a>
                <a class="nav-link" href="vacunas.html">Vacunas</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h1 class="mb-4">👤 Registro de Dueños</h1>

       
        <div class="card p-4 mb-4">
            <h5>Nuevo / Editar Dueño</h5>

            
            <input type="hidden" id="duenoId">

            <input type="text" id="nombre" class="form-control mb-2" placeholder="Nombre" />
            <input type="text" id="telefono" class="form-control mb-2" placeholder="Teléfono" />
            <input type="email" id="correo" class="form-control mb-3" placeholder="Correo" />

            <button id="btnGuardar" class="btn btn-primary">Guardar</button>

            <div id="mensaje" class="mt-3"></div>
        </div>

 
        <div class="card p-4">
            <h5>Listado de Dueños</h5>

            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaDuenos"></tbody>
            </table>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="duenos.js"></script>
</body>

</html>
