<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vacunas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Perfil Médico</a>
        <div class="navbar-nav">
            <a class="nav-link" href="duenos.html">Dueños</a>
            <a class="nav-link" href="mascotas.html">Mascotas</a>
            <a class="nav-link active" href="vacunas.html">Vacunas</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>💉 Registro de Vacunas</h3>

    <div class="card p-4">
        <input type="number" id="mascotaId" class="form-control mb-2" placeholder="ID de Mascota">

        <input type="text" id="nombreVacuna" class="form-control mb-2" placeholder="Nombre de la vacuna">

        <label>Fecha aplicada</label>
        <input type="date" id="fechaAplicada" class="form-control mb-2">

        <label>Próxima fecha</label>
        <input type="date" id="proximaFecha" class="form-control mb-2">

        <textarea id="observaciones" class="form-control mb-3" placeholder="Observaciones"></textarea>

        <button class="btn btn-success" onclick="guardarVacuna()">Guardar Vacuna</button>

        <div id="mensaje"></div>
    </div>
</div>

<script src="vacunas.js"></script>
</body>
</html>
