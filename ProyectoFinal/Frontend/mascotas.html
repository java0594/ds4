<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro de Mascotas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- NAV -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">MiniPetCare</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Perfil Médico</a>
                <a class="nav-link" href="duenos.html">Dueños</a>
                <a class="nav-link active" href="mascotas.html">Mascotas</a>
                <a class="nav-link" href="vacunas.html">Vacunas</a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container mt-5">

        <h2 class="mb-4">🐾 Registro de Mascotas</h2>

        <!-- FORMULARIO -->
        <div class="card p-4 mb-4">
            <h5>Nueva / Editar Mascota</h5>

            <select id="duenoId" class="form-select mb-3">
                <option value="">Seleccione un dueño</option>
            </select>

            <input id="nombre" class="form-control mb-2" placeholder="Nombre">

            <select id="especie" class="form-select mb-2">
                <option value="">Seleccione especie</option>
                <option value="Canino">Canino</option>
                <option value="Felino">Felino</option>
            </select>

            <input id="raza" class="form-control mb-2" placeholder="Raza">

            <select id="sexo" class="form-select mb-2">
                <option value="">Sexo</option>
                <option value="M">M</option>
                <option value="F">F</option>
            </select>

            <input id="fechaNacimiento" type="date" class="form-control mb-3">

            <button id="btnGuardar" class="btn btn-primary" onclick="guardarMascota()">
                Guardar
            </button>

            <div id="mensaje" class="mt-3"></div>
        </div>

        <!-- LISTADO -->
        <div class="card p-4">
            <h5>Listado de Mascotas</h5>

            <table class="table table-bordered mt-3">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Dueño</th>
                        <th>Especie</th>
                        <th>Raza</th>
                        <th>Sexo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaMascotas">
                    <!-- JS pinta las filas aquí -->
                </tbody>
            </table>
        </div>

    </div>

    <!-- JS -->
    <script src="mascotas.js"></script>

</body>

</html>
